services:
  novel-generator:
    build: .
    container_name: novel-generator
    ports:
      - "8000:8000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      CHROMA_PERSIST_DIR: /app/data/vectorstore
    volumes:
      - vectorstore_data:/app/data/vectorstore
      - chapters_data:/app/data/chapters
      - ./context:/app/context:ro
      - ./rules:/app/rules:ro
      - ./skills:/app/skills:ro
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    container_name: novel-generator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app
    restart: unless-stopped
    profiles:
      - with-ollama

volumes:
  vectorstore_data:
  chapters_data:
  ollama_data:

networks:
  app:
