# Sử liệu thời Tây Sơn — bản thẩm định dùng chung cho mọi tiểu thuyết.
#
# Mỗi ghi chép BẮT BUỘC có nguồn. Ghi chép thiếu nguồn sẽ bị từ chối ngay khi
# nạp, chứ không bị bỏ qua âm thầm — công cụ chỉ được phép trả về những gì tác
# giả đã thẩm định.
#
# confidence: attested (chính sử ghi rõ) | probable (nhiều nguồn, chi tiết vênh)
#             | disputed (các nguồn mâu thuẫn)
# locked:     truyện không được mâu thuẫn. Mặc định true.
#
# Điểm rẽ nhánh của TỪNG truyện được khai báo trong novels/<id>/history/, không
# phải ở đây: sử liệu là chung, còn chỗ rẽ nhánh là của riêng mỗi tác phẩm.
#
# ⚠ Bản seed này do trợ lý soạn từ kiến thức phổ thông về giai đoạn Tây Sơn.
#   Hãy đối chiếu lại với nguồn trước khi tin tuyệt đối, nhất là các ngày âm
#   lịch quy đổi và các mốc còn tranh luận.

